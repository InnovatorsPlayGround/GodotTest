name: Build Sketch World Builder APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct game script
        shell: bash
        run: |
          mkdir -p scripts
          cat srcparts/main_00.txt srcparts/main_01.txt srcparts/main_02.txt srcparts/main_03.txt > scripts/Main.gd
          echo "Main.gd bytes: $(wc -c < scripts/Main.gd)"

      - name: Download supplied Kenney asset packs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p assets/town assets/expansion /tmp/town /tmp/expansion
          curl -L --fail --retry 3 -o /tmp/town.zip https://opengameart.org/sites/default/files/kenney_sketchtown_1.0.zip
          curl -L --fail --retry 3 -o /tmp/expansion.zip https://opengameart.org/sites/default/files/kenney_sketchtownexpansion.zip
          unzip -q /tmp/town.zip -d /tmp/town
          unzip -q /tmp/expansion.zip -d /tmp/expansion
          find /tmp/town -type f -path '*/Tiles/*.png' -exec cp {} assets/town/ \;
          find /tmp/expansion -type f -path '*/Tiles/*.png' -exec cp {} assets/expansion/ \;
          echo "Town sprites: $(find assets/town -name '*.png' | wc -l)"
          echo "Expansion sprites: $(find assets/expansion -name '*.png' | wc -l)"
          python3 tools/generate_catalog.py
          python3 - <<'PY'
          import json
          c=json.load(open('assets/catalog.json'))
          counts=c['counts']
          print('Catalog counts:', counts)
          assert len(c['assets']) >= 100, 'Catalog unexpectedly tiny'
          assert counts.get('Terrain',0) > 0
          assert counts.get('Paths',0) > 0, 'Path assets were not categorized'
          assert counts.get('Farms',0) > 0, 'Farm assets were not categorized'
          assert counts.get('Buildings',0) > 0, 'Building assets were not categorized'
          PY

      - name: Ensure Godot Android SDK requirements
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN=$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -1)
          chmod +x "$GODOT_BIN"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot
          curl -L --fail --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot_templates "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/keystores"
          KEYSTORE="$HOME/.local/share/godot/keystores/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 2 || true
          SETTINGS=$(find "$HOME/.config/godot" -type f -name 'editor_settings-*.tres' | head -1)
          python3 - "$SETTINGS" <<'PY'
          import os, re, sys
          from pathlib import Path
          path=Path(sys.argv[1]); text=path.read_text()
          vals={'export/android/android_sdk_path':os.environ['ANDROID_HOME'],'export/android/java_sdk_path':os.environ['JAVA_HOME'],'export/android/debug_keystore':str(Path.home()/'.local/share/godot/keystores/debug.keystore'),'export/android/debug_keystore_user':'androiddebugkey','export/android/debug_keystore_pass':'android'}
          for k,v in vals.items():
              line=f'{k} = "{v}"'; pat=rf'(?m)^{re.escape(k)}\s*=.*$'
              text=re.sub(pat,line,text) if re.search(pat,text) else text.replace('[resource]\n','[resource]\n'+line+'\n',1)
          path.write_text(text)
          PY

      - name: Validate Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 4 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot-import.log; then exit 1; fi
          timeout 6s godot --headless --path "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/godot-runtime.log || true
          if grep -E "SCRIPT ERROR|Invalid call|Parse Error" /tmp/godot-runtime.log; then exit 1; fi

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.local/share/godot/keystores/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" build/SketchWorldBuilder-v0.3.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/SketchWorldBuilder-v0.3.apk
          unzip -t build/SketchWorldBuilder-v0.3.apk >/dev/null
          ls -lh build/SketchWorldBuilder-v0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SketchWorldBuilder-v0.3-APK
          path: build/SketchWorldBuilder-v0.3.apk
          if-no-files-found: error
          retention-days: 14
